[tool.poetry]
# package-mode = false: o Poetry só gerencia dependências. O código é resolvido via
# PYTHONPATH=app (ver Dockerfiles e README), o que permite manter este arquivo em infra/.
package-mode = false
name = "credibot"
version = "0.4.0"
description = "Agente Bancário Inteligente — API FastAPI + UI Streamlit (LangGraph + RAG)"
authors = ["Candidato <candidato@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Orquestração de agentes + sessões
langgraph = "^1.2.8"
langgraph-checkpoint-redis = "^0.5.0"
redis = "^7.4.1"

# Providers de LLM
langchain-core = "^1.4.9"
langchain-google-genai = "^4.2.7"
langchain-groq = "^1.1.3"

# RAG (vector store)
langchain-chroma = "^1.1.0"
langchain-text-splitters = "^1.1.2"

# API + UI
fastapi = "^0.115.5"
uvicorn = { extras = ["standard"], version = "^0.32.1" }
streamlit = "^1.39.0"

# Base
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
python-dotenv = "^1.0.1"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
requests-mock = "^1.12.1"
httpx = "^0.28.1"  # exigido por google-genai (via langchain-google-genai 4.x)
ruff = "^0.7.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
